name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The font test measures installed faces.
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu fonts-freefont-ttf fonts-crosextra-caladea
      - run: npm test
