name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every pull request: the tests that need no browser. Seconds, not minutes.
  quick:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHROME_PATH: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  # By hand only (Actions, Run workflow): the same tests with a browser, which take minutes.
  browser:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The font test measures installed faces.
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu fonts-freefont-ttf fonts-crosextra-caladea
      - run: npm test
